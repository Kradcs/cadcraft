name: Windows Codex portable download
on:
  push:
    branches: [codex/windows-stl-models-v5]
permissions:
  contents: write
concurrency:
  group: windows-codex-portable-v5
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      CADCRAFT_REQUIRE_WINRES: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-portable-rust195
      - name: Build Windows executables
        shell: pwsh
        run: |
          cargo +1.95.0 build --locked --release --target x86_64-pc-windows-msvc -p cadcraft -p cadcraft-cli
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test STL parsing, mesh edits, rendering and UI on Windows
        shell: pwsh
        run: |
          cargo +1.95.0 test --locked --release --target x86_64-pc-windows-msvc -p cadcraft-io --lib stl::
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.95.0 test --locked --release --target x86_64-pc-windows-msvc -p cadcraft-engine -p cadcraft-render -p cadcraft-ui-egui --lib mesh
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test attachments and the Codex panel on Windows
        shell: pwsh
        run: |
          cargo +1.95.0 test --locked --release --target x86_64-pc-windows-msvc -p cadcraft-ui-egui --lib agent::
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check the native drawing workflow
        shell: pwsh
        run: |
          $cli = "$pwd/target/x86_64-pc-windows-msvc/release/cadcraft-cli.exe"
          & $cli --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $cli run --metric --cmd 'circle {"center":[5,5],"radius":2}' --save "$env:RUNNER_TEMP/smoke.dxf" --export "$env:RUNNER_TEMP/smoke.png"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $drawing = (& $cli info "$env:RUNNER_TEMP/smoke.dxf" | ConvertFrom-Json)
          if ($LASTEXITCODE -or $drawing.entityCount -ne 1 -or $drawing.counts.Circle -ne 1) { throw 'Native drawing smoke test failed' }
      - name: Check native STL import, transform, save and reopen
        shell: pwsh
        run: |
          @'
          solid tetrahedron
          facet normal 0 0 0
          outer loop
          vertex 0 0 0
          vertex 20 0 0
          vertex 0 10 0
          endloop
          endfacet
          facet normal 0 0 0
          outer loop
          vertex 0 0 0
          vertex 0 0 30
          vertex 20 0 0
          endloop
          endfacet
          facet normal 0 0 0
          outer loop
          vertex 0 0 0
          vertex 0 10 0
          vertex 0 0 30
          endloop
          endfacet
          facet normal 0 0 0
          outer loop
          vertex 20 0 0
          vertex 0 0 30
          vertex 0 10 0
          endloop
          endfacet
          endsolid tetrahedron
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP/model.stl" -Encoding utf8
          $cli = "$pwd/target/x86_64-pc-windows-msvc/release/cadcraft-cli.exe"
          & $cli run "$env:RUNNER_TEMP/model.stl" --cmd 'mesh.units {"unit":"mm"}' --cmd 'mesh.resize {"axis":"z","size":100}' --cmd 'mesh.rotate {"axis":"z","degrees":90}' --cmd 'mesh.center {"ground":true}' --save "$env:RUNNER_TEMP/result.stl"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $model = (& $cli info "$env:RUNNER_TEMP/result.stl" | ConvertFrom-Json)
          if ($LASTEXITCODE -or $model.type -ne 'stlMesh' -or $model.triangles -ne 4 -or $model.unit -ne 'mm' -or [Math]::Abs($model.size.z - 100) -gt 0.001 -or [Math]::Abs($model.bounds.min.z) -gt 0.001) { throw 'Native STL smoke test failed' }
      - name: Install official Codex and create portable package
        shell: pwsh
        run: |
          $npmPrefix = Join-Path $env:RUNNER_TEMP 'codex-runtime'
          npm.cmd install --prefix $npmPrefix --include=optional '@openai/codex@0.163.0'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $matches = @(Get-ChildItem -LiteralPath "$npmPrefix/node_modules" -Recurse -Filter codex.exe -File | Where-Object { $_.FullName -match 'x86_64-pc-windows-msvc[\\/]bin[\\/]codex.exe$' })
          if ($matches.Count -ne 1) { throw 'Cannot locate official Windows x64 Codex package' }
          $vendor = Split-Path (Split-Path $matches[0].FullName)
          & $matches[0].FullName --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./packaging/windows/portable-agent.ps1 -BinaryDirectory "$pwd/target/x86_64-pc-windows-msvc/release" -CodexVendorDirectory $vendor -OutputDirectory "$pwd/dist/agent-portable"
      - name: Publish experimental download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          Experimental Windows x64 CADCraft build with a standalone STL 3D workspace, Codex mesh tools and PDF/PNG/JPG/TXT reference attachments.

          Download CADCraft-Windows-portatil-v5.zip, extract it into a new directory and run ABRIR-CADCRAFT.cmd. Codex 0.163.0 is included. No Rust, Node.js or Visual Studio installation is needed on the destination PC.

          Open File > Open STL Model (Arquivo > Abrir modelo STL), or drag an STL onto the app. Orbit with left-drag, pan with right-drag, and zoom with the wheel. Use the controls to move, rotate, resize, center and export the mesh. Undo/Redo and unsaved-change handling are included. Choose the original STL unit explicitly before physical-size requests.

          Open Window > Codex Assistant (Janela > Assistente Codex), connect and sign in with ChatGPT if needed. Start a new conversation after switching documents. The agent can inspect and transform the model and choose camera views. Saving stays under your control. This version edits the whole mesh; it does not sculpt details, generate characters, repair meshes or import OBJ/STEP/IGES. See docs/stl-models.md for scope and limits.

          Existing PDF/PNG/JPG/TXT reference attachments remain available in the conversation panel. STL files open locally in their own model tabs, rather than being sent as conversation attachments. No user-supplied models are bundled.

          STL parsing, round trips, unit conversions, geometry edits, Undo/Redo, depth ordering, UI controls and agent tools were tested on the native Windows runner. Native CLI smoke tests also verify STL import/transform/save/reopen and the existing 2D DXF/PNG workflow. Interactive desktop operation and a signed-in model request still require user validation.

          This is an experimental development build, not an official project release. SHA-256 checksum and licenses are included.
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP/release-notes.md" -Encoding utf8
          gh release create cadcraft-codex-windows-v5 ./dist/agent-portable/CADCraft-Windows-portatil-v5.zip ./dist/agent-portable/CADCraft-Windows-portatil-v5.zip.sha256 --repo '${{ github.repository }}' --target '${{ github.sha }}' --prerelease --title 'CADCraft com Codex - Windows x64 (STL 3D v5)' --notes-file "$env:RUNNER_TEMP/release-notes.md"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
