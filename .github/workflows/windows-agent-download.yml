name: Windows Codex portable download
on:
  push:
    branches: [codex/windows-agent-composer-v7]
permissions:
  contents: write
concurrency:
  group: windows-codex-portable-v7
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      CADCRAFT_REQUIRE_WINRES: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-portable-rust195
      - name: Build Windows executables
        shell: pwsh
        run: |
          cargo +1.95.0 build --locked --release --target x86_64-pc-windows-msvc -p cadcraft -p cadcraft-cli
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test measured construction, STEP, CAD3D, STL, UI and agent tools
        shell: pwsh
        run: |
          cargo +1.95.0 test --locked --release --target x86_64-pc-windows-msvc -p cadcraft-geom -p cadcraft-io -p cadcraft-engine -p cadcraft-render -p cadcraft-ui-egui --lib model_
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.95.0 test --locked --release --target x86_64-pc-windows-msvc -p cadcraft-geom -p cadcraft-io -p cadcraft-engine -p cadcraft-render -p cadcraft-ui-egui --lib mesh
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.95.0 test --locked --release --target x86_64-pc-windows-msvc -p cadcraft-geom -p cadcraft-io -p cadcraft-engine -p cadcraft-render -p cadcraft-ui-egui --lib stl::
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.95.0 test --locked --release --target x86_64-pc-windows-msvc -p cadcraft-geom -p cadcraft-io -p cadcraft-engine -p cadcraft-render -p cadcraft-ui-egui --lib agent::
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.95.0 test --locked --release --target x86_64-pc-windows-msvc -p cadcraft-geom -p cadcraft-io -p cadcraft-engine -p cadcraft-render -p cadcraft-ui-egui --lib i18n::tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check the native drawing workflow
        shell: pwsh
        run: |
          $cli = "$pwd/target/x86_64-pc-windows-msvc/release/cadcraft-cli.exe"
          & $cli --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $cli run --metric --cmd 'circle {"center":[5,5],"radius":2}' --save "$env:RUNNER_TEMP/smoke.dxf" --export "$env:RUNNER_TEMP/smoke.png"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $drawing = (& $cli info "$env:RUNNER_TEMP/smoke.dxf" | ConvertFrom-Json)
          if ($LASTEXITCODE -or $drawing.entityCount -ne 1 -or $drawing.counts.Circle -ne 1) { throw 'Native drawing smoke test failed' }
      - name: Check native STL import, transform, save and reopen
        shell: pwsh
        run: |
          @'
          solid tetrahedron
          facet normal 0 0 0
          outer loop
          vertex 0 0 0
          vertex 20 0 0
          vertex 0 10 0
          endloop
          endfacet
          facet normal 0 0 0
          outer loop
          vertex 0 0 0
          vertex 0 0 30
          vertex 20 0 0
          endloop
          endfacet
          facet normal 0 0 0
          outer loop
          vertex 0 0 0
          vertex 0 10 0
          vertex 0 0 30
          endloop
          endfacet
          facet normal 0 0 0
          outer loop
          vertex 20 0 0
          vertex 0 0 30
          vertex 0 10 0
          endloop
          endfacet
          endsolid tetrahedron
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP/model.stl" -Encoding utf8
          $cli = "$pwd/target/x86_64-pc-windows-msvc/release/cadcraft-cli.exe"
          & $cli run "$env:RUNNER_TEMP/model.stl" --cmd 'mesh.units {"unit":"mm"}' --cmd 'mesh.resize {"axis":"z","size":100}' --cmd 'mesh.rotate {"axis":"z","degrees":90}' --cmd 'mesh.center {"ground":true}' --save "$env:RUNNER_TEMP/result.stl"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $model = (& $cli info "$env:RUNNER_TEMP/result.stl" | ConvertFrom-Json)
          if ($LASTEXITCODE -or $model.type -ne 'stlMesh' -or $model.triangles -ne 4 -or $model.unit -ne 'mm' -or [Math]::Abs($model.size.z - 100) -gt 0.001 -or [Math]::Abs($model.bounds.min.z) -gt 0.001) { throw 'Native STL smoke test failed' }
      - name: Check editable flange and office on native Windows
        shell: pwsh
        run: |
          $cli = "$pwd/target/x86_64-pc-windows-msvc/release/cadcraft-cli.exe"
          & $cli run "$pwd/docs/examples/flange.cad3d" --cmd 'model.edit {"name":"flange_blank","changes":{"height":8}}' --save "$env:RUNNER_TEMP/flange.cad3d" --export "$env:RUNNER_TEMP/flange.step"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $part = (& $cli info "$env:RUNNER_TEMP/flange.cad3d" | ConvertFrom-Json)
          if ($LASTEXITCODE -or $part.unit -ne 'mm' -or [Math]::Abs($part.size.z - 8) -gt 0.001 -or $part.recipe.nodes.Count -ne 11) { throw 'Editable flange smoke test failed' }
          & $cli run "$env:RUNNER_TEMP/flange.cad3d" --export "$env:RUNNER_TEMP/flange.stl"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $cli run "$pwd/docs/examples/office.cad3d" --cmd 'model.edit {"name":"wall_back","changes":{"size":[8,0.15,3.2]}}' --save "$env:RUNNER_TEMP/office.cad3d" --export "$env:RUNNER_TEMP/office.step"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $office = (& $cli info "$env:RUNNER_TEMP/office.cad3d" | ConvertFrom-Json)
          if ($LASTEXITCODE -or $office.unit -ne 'm' -or [Math]::Abs($office.size.z - 3.3) -gt 0.001) { throw 'Editable office smoke test failed' }
          if (!(Select-String -LiteralPath "$env:RUNNER_TEMP/flange.step" -Pattern 'FACETED_BREP\(' -Quiet)) { throw 'Missing STEP faceted geometry' }
      - name: Install official Codex and create portable package
        shell: pwsh
        run: |
          $npmPrefix = Join-Path $env:RUNNER_TEMP 'codex-runtime'
          npm.cmd install --prefix $npmPrefix --include=optional '@openai/codex@0.163.0'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $matches = @(Get-ChildItem -LiteralPath "$npmPrefix/node_modules" -Recurse -Filter codex.exe -File | Where-Object { $_.FullName -match 'x86_64-pc-windows-msvc[\\/]bin[\\/]codex.exe$' })
          if ($matches.Count -ne 1) { throw 'Cannot locate official Windows x64 Codex package' }
          $vendor = Split-Path (Split-Path $matches[0].FullName)
          & $matches[0].FullName --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./packaging/windows/portable-agent.ps1 -BinaryDirectory "$pwd/target/x86_64-pc-windows-msvc/release" -CodexVendorDirectory $vendor -OutputDirectory "$pwd/dist/agent-portable"
      - name: Publish experimental download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          Experimental Windows x64 CADCraft with the integrated Codex assistant and a scrollable prompt editor.

          Download CADCraft-Windows-portatil-v7.zip, extract everything into a new folder and run ABRIR-CADCRAFT.cmd. Official Codex 0.163.0 is included; no Rust, Node.js or Visual Studio installation is needed on the destination PC.

          Long prompts now scroll inside a bounded editor. Send and Stop stay at the bottom of the Codex panel. Press Enter while the prompt field is focused to send the full message, including when its text is selected. Use Shift+Enter for a new line. Enter elsewhere does not submit the prompt; authentication, attachment preparation and in-progress task checks still apply.

          Reference PDF/PNG/JPG/TXT attachments, editable CAD3D construction, measured parts and office maquettes, 2D extrusion, bounded booleans, STL import/export and faceted STEP export remain available. Read MODELAGEM-3D.md for modeling scope and limits. No user-supplied models are included.

          UI regression tests cover long prompts, a visible and clickable Send button at multiple window heights, attachments, Enter with selected text, Shift+Enter and disabled/unfocused sending. Native Windows tests also cover existing modeling, mesh, attachment, translation and CLI workflows. Real ChatGPT sign-in remains user-managed.

          This is an experimental development build, not an official project release. SHA-256 checksum and licenses are included.
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP/release-notes.md" -Encoding utf8
          gh release create cadcraft-codex-windows-v7 ./dist/agent-portable/CADCraft-Windows-portatil-v7.zip ./dist/agent-portable/CADCraft-Windows-portatil-v7.zip.sha256 --repo '${{ github.repository }}' --target '${{ github.sha }}' --prerelease --title 'CADCraft com Codex - Windows x64 (Painel Codex v7)' --notes-file "$env:RUNNER_TEMP/release-notes.md"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
